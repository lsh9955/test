name: Publish Suwon Trail v0.11.0 update

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-trail-v0110.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and verify v0.11.0 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-9c6c-8209-93bd-89f7a1e4b0ca/raw?se=2026-08-09T08%3A39%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=60fc61bb-9d37-5d3e-8608-1da9c97bfabe&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T23%3A04%3A30Z&ske=2026-08-09T23%3A04%3A30Z&sks=b&skv=2026-02-06&sig=zY9fBH5Nkp9uVKnBBxn%2Bue3L0qnn6AV85gnMu7c%2BhXw%3D' \
            --output /tmp/v0110.zip
          rm -rf /tmp/v0110 && mkdir -p /tmp/v0110
          unzip -q /tmp/v0110.zip -d /tmp/v0110
          APK=/tmp/v0110/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo 'c4457335963c24f0f51483254534385f99af4c2e59be53c75aeb7ea502378c27  /tmp/v0110/app/build/outputs/apk/release/app-release.apk' | sha256sum -c -

      - name: Publish to in-app update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin suwon-trail-updates
          git switch --force-create suwon-trail-updates origin/suwon-trail-updates
          mkdir -p suwon-trail
          cp /tmp/v0110/app/build/outputs/apk/release/app-release.apk suwon-trail/suwon-trail-0.11.0.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 27,
            "versionName": "0.11.0",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.11.0.apk",
            "sha256": "c4457335963c24f0f51483254534385f99af4c2e59be53c75aeb7ea502378c27",
            "notes": "12주 트레일 체력모델·50K 준비도·개인 예상완주시간·주간 훈련제안과 시간대별 위험 타임라인을 추가했어요. 추천 코스 GPX를 직접 등록하거나 실제 Samsung Health GPS 기록을 오프라인 코스로 저장할 수 있고, 오프라인 경로·고저도·남은 거리/상승·ETA와 75m 코스 이탈 진동 경고를 제공합니다."
          }
          JSON
          printf '%s  %s\n' 'c4457335963c24f0f51483254534385f99af4c2e59be53c75aeb7ea502378c27' 'suwon-trail-0.11.0.apk' > suwon-trail/SHA256SUMS
          git add suwon-trail/suwon-trail-0.11.0.apk suwon-trail/latest.json suwon-trail/SHA256SUMS
          git commit -m "Publish Suwon Trail v0.11.0 update"
          git push origin HEAD:suwon-trail-updates

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git switch master
          git pull --ff-only origin master
          git rm .github/workflows/publish-suwon-trail-v0110.yml
          git commit -m "Remove one-time v0.11.0 publisher"
          git push origin master
