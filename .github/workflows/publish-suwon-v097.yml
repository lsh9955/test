name: Publish Suwon Trail v0.9.7

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-v097.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v6
        with:
          ref: suwon-trail-updates
          fetch-depth: 0

      - name: Download and verify v0.9.7
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-db68-820b-af7f-2d062d9bbf21/raw?se=2026-08-05T22:00:16Z&sp=r&sv=2026-02-06&sr=b&scid=b8a3ed43-c6fd-5325-a7af-81d3ec5892ad&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T00:33:40Z&ske=2026-08-06T00:33:40Z&sks=b&skv=2026-02-06&sig=yE%2BCXTf2AkQz9bmRqMf7dWc6Ie1suYDik1SlGajZmyM%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/suwon-v097.zip
          rm -rf /tmp/suwon-v097
          mkdir -p /tmp/suwon-v097
          unzip -q /tmp/suwon-v097.zip -d /tmp/suwon-v097
          APK=/tmp/suwon-v097/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo "fb49044dc6e7cdbdc7635f225bb90713079da5527801886cd41c2c7f9d3026c1  $APK" | sha256sum -c -
          mkdir -p suwon-trail
          cp "$APK" suwon-trail/suwon-trail-0.9.7.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 19,
            "versionName": "0.9.7",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.9.7.apk",
            "sha256": "fb49044dc6e7cdbdc7635f225bb90713079da5527801886cd41c2c7f9d3026c1",
            "notes": "추천 코스는 원본 고저도만 표시하고, 운동 고저도와 GPS 지도의 화면 비율 및 펼침 동작을 복구했어요."
          }
          JSON
          printf '%s  %s\n' "fb49044dc6e7cdbdc7635f225bb90713079da5527801886cd41c2c7f9d3026c1" "suwon-trail-0.9.7.apk" > suwon-trail/SHA256SUMS

      - name: Publish update files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suwon-trail/
          git commit -m "publish Suwon Trail v0.9.7"
          git push origin HEAD:suwon-trail-updates
