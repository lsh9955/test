name: Publish Suwon Trail v0.10.0 update

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-trail-v0100.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and verify v0.10.0 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-e580-822f-8efc-c5622da3d7d1/raw?se=2026-08-09T08%3A15%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=5ca9df6c-babb-5e6a-827e-552a9a6f9635&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T02%3A24%3A22Z&ske=2026-08-10T02%3A24%3A22Z&sks=b&skv=2026-02-06&sig=mEA7ODYYocF/SqJzWLYx/qL7wFlsBwk21PO/AiApsG0%3D' \
            --output /tmp/v0100.zip
          rm -rf /tmp/v0100
          mkdir -p /tmp/v0100
          unzip -q /tmp/v0100.zip -d /tmp/v0100
          APK=/tmp/v0100/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo '6c041e7a6dd05c7451d34b69cb5163250a7dd96cc223eec2974346c2947624c9  /tmp/v0100/app/build/outputs/apk/release/app-release.apk' | sha256sum -c -

      - name: Publish to in-app update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin suwon-trail-updates
          git switch --force-create suwon-trail-updates origin/suwon-trail-updates
          mkdir -p suwon-trail
          cp /tmp/v0100/app/build/outputs/apk/release/app-release.apk suwon-trail/suwon-trail-0.10.0.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 26,
            "versionName": "0.10.0",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.10.0.apk",
            "sha256": "6c041e7a6dd05c7451d34b69cb5163250a7dd96cc223eec2974346c2947624c9",
            "notes": "훈련 대시보드와 최근 운동량 기반 주말 맞춤 추천을 추가했어요. 코스에는 즐겨찾기·주말 후보·출발지 지도·GPX 검증 상태를 표시하고, 날씨 기반 안전 경고와 권장 출발·예상 종료시각도 제공합니다. 실제 GPS 운동은 GPX 파일로 내보낼 수 있고, 360/390/412px 모바일 UI 자동검사도 강화했어요."
          }
          JSON
          printf '%s  %s\n' \
            '6c041e7a6dd05c7451d34b69cb5163250a7dd96cc223eec2974346c2947624c9' \
            'suwon-trail-0.10.0.apk' > suwon-trail/SHA256SUMS
          git add suwon-trail/suwon-trail-0.10.0.apk suwon-trail/latest.json suwon-trail/SHA256SUMS
          git commit -m "Publish Suwon Trail v0.10.0 update"
          git push origin HEAD:suwon-trail-updates

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git switch master
          git pull --ff-only origin master
          git rm .github/workflows/publish-suwon-trail-v0100.yml
          git commit -m "Remove one-time v0.10.0 publisher"
          git push origin master
