name: Publish Suwon Trail v0.12.0 update

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-trail-v0120.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and verify v0.12.0 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://sdmntprwestus3.oaiusercontent.com/files/00000000-3b5c-81fd-be39-a396b3cc85d3/raw?se=2026-08-09T12%3A43%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=83da9ef4-0e14-553a-8de7-c07fc96ac12a&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T12%3A13%3A43Z&ske=2026-08-10T12%3A13%3A43Z&sks=b&skv=2026-02-06&sig=VSrTZoOBqB4fJo2ly/vBC5mmheSp/nXhsJ%2BP/HksoJs%3D' \
            --output /tmp/v0120.zip
          rm -rf /tmp/v0120 && mkdir -p /tmp/v0120
          unzip -q /tmp/v0120.zip -d /tmp/v0120
          APK=/tmp/v0120/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo '39d7ef0a546aa1b649bcaec26566a4b79e8c950d42b1a30767af86c994fe9deb  /tmp/v0120/app/build/outputs/apk/release/app-release.apk' | sha256sum -c -

      - name: Publish to in-app update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin suwon-trail-updates
          git switch --force-create suwon-trail-updates origin/suwon-trail-updates
          mkdir -p suwon-trail
          cp /tmp/v0120/app/build/outputs/apk/release/app-release.apk suwon-trail/suwon-trail-0.12.0.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 30,
            "versionName": "0.12.0",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.12.0.apk",
            "sha256": "39d7ef0a546aa1b649bcaec26566a4b79e8c950d42b1a30767af86c994fe9deb",
            "notes": "내 대회 기능을 추가했어요. 참가 예정/완료 대회를 로컬에 저장하고, 대회별 준비도와 D-day를 확인할 수 있습니다. 완료 대회는 날짜·거리가 비슷한 Samsung Health GPS 기록을 연결해 지도와 고저도를 열 수 있고, ITRA/UTMB 링크·점수·공식 기록·순위를 저장하거나 결과 텍스트 붙여넣기로 빠르게 입력할 수 있어요."
          }
          JSON
          printf '%s  %s\n' '39d7ef0a546aa1b649bcaec26566a4b79e8c950d42b1a30767af86c994fe9deb' 'suwon-trail-0.12.0.apk' > suwon-trail/SHA256SUMS
          git add suwon-trail/suwon-trail-0.12.0.apk suwon-trail/latest.json suwon-trail/SHA256SUMS
          git commit -m "Publish Suwon Trail v0.12.0 update"
          git push origin HEAD:suwon-trail-updates

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git switch master
          git pull --ff-only origin master
          git rm .github/workflows/publish-suwon-trail-v0120.yml
          git commit -m "Remove one-time v0.12.0 publisher"
          git push origin master
