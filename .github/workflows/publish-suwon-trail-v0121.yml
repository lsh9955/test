name: Publish Suwon Trail v0.12.1 update

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-trail-v0121.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and verify v0.12.1 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-c760-81f7-8c67-7f68f9564f32/raw?se=2026-08-09T13%3A08%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=7c33623f-7926-53e4-97eb-477e9e3d827d&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T10%3A04%3A43Z&ske=2026-08-10T10%3A04%3A43Z&sks=b&skv=2026-02-06&sig=%2B/tRtS3%2BdE9l2%2BsvXlUPLX6MH5Z9oaPIVOqBrthVbbo%3D' \
            --output /tmp/v0121.zip
          rm -rf /tmp/v0121 && mkdir -p /tmp/v0121
          unzip -q /tmp/v0121.zip -d /tmp/v0121
          APK=/tmp/v0121/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo 'f9e16d68dc280234a1b9c7efbf782ed4a689d6fb0ded4fcd4b21f1379d79e45b  /tmp/v0121/app/build/outputs/apk/release/app-release.apk' | sha256sum -c -

      - name: Publish to in-app update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin suwon-trail-updates
          git switch --force-create suwon-trail-updates origin/suwon-trail-updates
          mkdir -p suwon-trail
          cp /tmp/v0121/app/build/outputs/apk/release/app-release.apk suwon-trail/suwon-trail-0.12.1.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 31,
            "versionName": "0.12.1",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.12.1.apk",
            "sha256": "f9e16d68dc280234a1b9c7efbf782ed4a689d6fb0ded4fcd4b21f1379d79e45b",
            "notes": "내 대회에 스크린샷 자동 분석을 추가했어요. ITRA·UTMB나 대회 결과 화면 스크린샷을 선택하면 한국어·영문 OCR을 기기에서 실행해 대회명, 날짜, 거리, 누적 상승, 공식 기록, 순위, ITRA/UTMB 점수를 자동으로 채웁니다. OCR 원문을 확인하고 잘못 인식된 항목은 저장 전에 바로 수정할 수 있어요."
          }
          JSON
          printf '%s  %s\n' 'f9e16d68dc280234a1b9c7efbf782ed4a689d6fb0ded4fcd4b21f1379d79e45b' 'suwon-trail-0.12.1.apk' > suwon-trail/SHA256SUMS
          git add suwon-trail/suwon-trail-0.12.1.apk suwon-trail/latest.json suwon-trail/SHA256SUMS
          git commit -m "Publish Suwon Trail v0.12.1 update"
          git push origin HEAD:suwon-trail-updates

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git switch master
          git pull --ff-only origin master
          git rm .github/workflows/publish-suwon-trail-v0121.yml
          git commit -m "Remove one-time v0.12.1 publisher"
          git push origin master
