name: Publish Suwon Trail v0.9.10 update

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-trail-v0910.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and verify v0.9.10 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-db0c-81fa-86fb-4cf1148ae75e/raw?se=2026-08-06T14%3A31%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=12ab8899-7b6d-5e2c-9fd3-cb971632f635&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A53%3A58Z&ske=2026-08-07T05%3A53%3A58Z&sks=b&skv=2026-02-06&sig=5LxLnW89G7sGB5aylSt8Y3MMRnOQ2SBV0zIk4MI%2BC4E%3D' \
            --output /tmp/v0910.zip
          rm -rf /tmp/v0910
          mkdir -p /tmp/v0910
          unzip -q /tmp/v0910.zip -d /tmp/v0910
          APK=/tmp/v0910/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo 'f46c0396d0f8074fec061ac062a1922bff8d4b53c2790ea17c05885fbe431e4b  /tmp/v0910/app/build/outputs/apk/release/app-release.apk' | sha256sum -c -

      - name: Publish to in-app update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin suwon-trail-updates
          git switch --force-create suwon-trail-updates origin/suwon-trail-updates
          mkdir -p suwon-trail
          cp /tmp/v0910/app/build/outputs/apk/release/app-release.apk suwon-trail/suwon-trail-0.9.10.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 22,
            "versionName": "0.9.10",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.9.10.apk",
            "sha256": "f46c0396d0f8074fec061ac062a1922bff8d4b53c2790ea17c05885fbe431e4b",
            "notes": "20개 코스의 개략 고저도를 거리·고도 축과 터치 조회가 있는 상세 프로필로 자동 변환해요. 기존 상세 고저도는 중복 없이 유지합니다."
          }
          JSON
          printf '%s  %s\n' \
            'f46c0396d0f8074fec061ac062a1922bff8d4b53c2790ea17c05885fbe431e4b' \
            'suwon-trail-0.9.10.apk' > suwon-trail/SHA256SUMS
          git add suwon-trail/suwon-trail-0.9.10.apk suwon-trail/latest.json suwon-trail/SHA256SUMS
          git commit -m "Publish Suwon Trail v0.9.10 update"
          git push origin HEAD:suwon-trail-updates

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git switch master
          git pull --ff-only origin master
          git rm .github/workflows/publish-suwon-trail-v0910.yml
          git commit -m "Remove one-time v0.9.10 publisher"
          git push origin master
