name: Publish Suwon Trail v0.9.6

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-v096.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v6
        with:
          ref: suwon-trail-updates
          fetch-depth: 0

      - name: Download and verify v0.9.6
        env:
          ARTIFACT_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-03cc-81f7-a123-f7f00d3bc59f/raw?se=2026-08-05T18:06:45Z&sp=r&sv=2026-02-06&sr=b&scid=9e578fba-4d3a-5c05-a4a8-e1ead931b823&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T00:32:04Z&ske=2026-08-06T00:32:04Z&sks=b&skv=2026-02-06&sig=yW7CttJpS1AKhdc7H8fbTB0vK2Zn35nG445nFvVfcGs%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/suwon-v096.zip
          rm -rf /tmp/suwon-v096
          mkdir -p /tmp/suwon-v096
          unzip -q /tmp/suwon-v096.zip -d /tmp/suwon-v096
          APK=/tmp/suwon-v096/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo "6ec6ae418195414361cda7c28454ec1c0cce5b9cf35148f41a6f5b39f6e1acb6  $APK" | sha256sum -c -
          mkdir -p suwon-trail
          cp "$APK" suwon-trail/suwon-trail-0.9.6.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 18,
            "versionName": "0.9.6",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.9.6.apk",
            "sha256": "6ec6ae418195414361cda7c28454ec1c0cce5b9cf35148f41a6f5b39f6e1acb6",
            "notes": "추천 경로의 고저도 축 중복 표시와 모바일 화면 넘침을 수정했어요. 원래 상세 축이 있는 그래프는 그대로 표시합니다."
          }
          JSON
          printf '%s  %s\n' "6ec6ae418195414361cda7c28454ec1c0cce5b9cf35148f41a6f5b39f6e1acb6" "suwon-trail-0.9.6.apk" > suwon-trail/SHA256SUMS

      - name: Publish update files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suwon-trail/
          git commit -m "publish Suwon Trail v0.9.6"
          git push origin HEAD:suwon-trail-updates
