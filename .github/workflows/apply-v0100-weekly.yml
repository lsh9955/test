name: Apply v0.10.0 weekly safety and provenance

on:
  push:
    branches: ["master"]
    paths:
      - "scripts/patch_v0100_weekly.py"
      - ".github/workflows/apply-v0100-weekly.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply generator patch
        run: |
          set -euo pipefail
          python3 scripts/patch_v0100_weekly.py
          python3 -m py_compile scripts/update_suwon_trail_weekly.py
          git diff --check
      - name: Commit generator
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_suwon_trail_weekly.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add v0.10.0 trail safety and provenance data"
          git push origin master
