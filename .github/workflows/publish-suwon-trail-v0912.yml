name: Publish Suwon Trail v0.9.12 update

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-trail-v0912.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and verify v0.9.12 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://sdmntprnznorth.oaiusercontent.com/files/00000000-a99c-820b-9c2e-94ca354cc164/raw?se=2026-08-08T01%3A09%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=6ed58bcb-c3f0-5659-9c9c-2122f2828c80&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T04%3A22%3A26Z&ske=2026-08-08T04%3A22%3A26Z&sks=b&skv=2026-02-06&sig=PYhrDE3lMYZEvfhrqLBGgvFtFDlDDZFi3oLsl7yDJ0s%3D' \
            --output /tmp/v0912.zip
          rm -rf /tmp/v0912
          mkdir -p /tmp/v0912
          unzip -q /tmp/v0912.zip -d /tmp/v0912
          APK=/tmp/v0912/app-release.apk
          test -s "$APK"
          echo 'cb3d53455a3d45fcbfdb47da37bf6b89d0a75627138b5b580ca81a84de68184f  /tmp/v0912/app-release.apk' | sha256sum -c -

      - name: Publish to in-app update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin suwon-trail-updates
          git switch --force-create suwon-trail-updates origin/suwon-trail-updates
          mkdir -p suwon-trail
          cp /tmp/v0912/app-release.apk suwon-trail/suwon-trail-0.9.12.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 24,
            "versionName": "0.9.12",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.9.12.apk",
            "sha256": "cb3d53455a3d45fcbfdb47da37bf6b89d0a75627138b5b580ca81a84de68184f",
            "notes": "전체 모바일 UI를 실제 화면으로 다시 검증했어요. 20개 코스 모두 상세 고저도를 전체 폭으로 정렬하고, 세로로 깨지던 문구와 과도한 여백을 수정했습니다. 주말 추천 펼침 상태와 코스명 표시, GPS 기록 목록·상세 화면도 함께 점검했습니다."
          }
          JSON
          printf '%s  %s\n' \
            'cb3d53455a3d45fcbfdb47da37bf6b89d0a75627138b5b580ca81a84de68184f' \
            'suwon-trail-0.9.12.apk' > suwon-trail/SHA256SUMS
          git add suwon-trail/suwon-trail-0.9.12.apk suwon-trail/latest.json suwon-trail/SHA256SUMS
          git commit -m "Publish Suwon Trail v0.9.12 update"
          git push origin HEAD:suwon-trail-updates

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git switch master
          git pull --ff-only origin master
          git rm .github/workflows/publish-suwon-trail-v0912.yml
          git commit -m "Remove one-time v0.9.12 publisher"
          git push origin master
