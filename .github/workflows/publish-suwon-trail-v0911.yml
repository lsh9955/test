name: Publish Suwon Trail v0.9.11 update

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-trail-v0911.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and verify v0.9.11 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://sdmntprnznorth.oaiusercontent.com/files/00000000-31ec-820b-a53a-3ff62076c043/raw?se=2026-08-08T00%3A44%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=9e8cbb76-06af-594b-ae83-2279933648a0&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T22%3A30%3A01Z&ske=2026-08-08T22%3A30%3A01Z&sks=b&skv=2026-02-06&sig=v3vnGyj74psWJP51zJtEBtmlP9gQvS4ft6ljSaJIoTc%3D' \
            --output /tmp/v0911.zip
          rm -rf /tmp/v0911
          mkdir -p /tmp/v0911
          unzip -q /tmp/v0911.zip -d /tmp/v0911
          APK=/tmp/v0911/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo 'c7eac098fed3a8e699d324f76d7135a4bca9e7baf78131ad868929a43736e8a6  /tmp/v0911/app/build/outputs/apk/release/app-release.apk' | sha256sum -c -

      - name: Publish to in-app update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin suwon-trail-updates
          git switch --force-create suwon-trail-updates origin/suwon-trail-updates
          mkdir -p suwon-trail
          cp /tmp/v0911/app/build/outputs/apk/release/app-release.apk suwon-trail/suwon-trail-0.9.11.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 23,
            "versionName": "0.9.11",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.9.11.apk",
            "sha256": "c7eac098fed3a8e699d324f76d7135a4bca9e7baf78131ad868929a43736e8a6",
            "notes": "화면이 반복 중첩되던 문제와 주말 추천 카드가 다시 접히던 문제를 긴급 수정했어요. 자동 생성 UI 재인식을 차단하고 펼침 상태를 안정적으로 유지합니다."
          }
          JSON
          printf '%s  %s\n' \
            'c7eac098fed3a8e699d324f76d7135a4bca9e7baf78131ad868929a43736e8a6' \
            'suwon-trail-0.9.11.apk' > suwon-trail/SHA256SUMS
          git add suwon-trail/suwon-trail-0.9.11.apk suwon-trail/latest.json suwon-trail/SHA256SUMS
          git commit -m "Publish Suwon Trail v0.9.11 update"
          git push origin HEAD:suwon-trail-updates

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git switch master
          git pull --ff-only origin master
          git rm .github/workflows/publish-suwon-trail-v0911.yml
          git commit -m "Remove one-time v0.9.11 publisher"
          git push origin master
