name: Publish Suwon Trail v0.13.0 update

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/publish-suwon-trail-v0130.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and verify v0.13.0 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-e28c-8206-843d-c74e6bff72cb/raw?se=2026-08-09T14%3A14%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=18c7e6a2-90e8-53c8-87a9-b7e60e4d9a20&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T02%3A18%3A21Z&ske=2026-08-10T02%3A18%3A21Z&sks=b&skv=2026-02-06&sig=T4TPgVwJSMeGJTahp9vt8Me6wbiWjepavhyyIqkfYrQ%3D' \
            --output /tmp/v0130.zip
          rm -rf /tmp/v0130 && mkdir -p /tmp/v0130
          unzip -q /tmp/v0130.zip -d /tmp/v0130
          APK=/tmp/v0130/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo '477130669f8a904b6e243c1a940ee2348c783dc7bd203288b715a12e606557d2  /tmp/v0130/app/build/outputs/apk/release/app-release.apk' | sha256sum -c -

      - name: Publish to in-app update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin suwon-trail-updates
          git switch --force-create suwon-trail-updates origin/suwon-trail-updates
          mkdir -p suwon-trail
          cp /tmp/v0130/app/build/outputs/apk/release/app-release.apk suwon-trail/suwon-trail-0.13.0.apk
          cat > suwon-trail/latest.json <<'JSON'
          {
            "versionCode": 32,
            "versionName": "0.13.0",
            "apkUrl": "https://raw.githubusercontent.com/lsh9955/test/suwon-trail-updates/suwon-trail/suwon-trail-0.13.0.apk",
            "sha256": "477130669f8a904b6e243c1a940ee2348c783dc7bd203288b715a12e606557d2",
            "notes": "목표 대회 맞춤 훈련 코치를 추가했어요. 예정 대회를 목표로 지정하면 거리·상승·D-day와 최근 Samsung Health 훈련 기록을 바탕으로 주간 이지런·업힐·핵심 롱 트레일·회복 계획을 제안하고 실제 기록을 자동 완료 처리합니다. 대회 2주 전부터 테이퍼/레이스 주간으로 조정하며, 일요일에는 다음 주 계획을 미리 보여줍니다. 대회 사진 분석 버튼의 글씨가 보이지 않던 문제와 작은 터치 버튼, OCR 원문 입력칸 폭 등 모바일 UI도 함께 개선했어요."
          }
          JSON
          printf '%s  %s\n' '477130669f8a904b6e243c1a940ee2348c783dc7bd203288b715a12e606557d2' 'suwon-trail-0.13.0.apk' > suwon-trail/SHA256SUMS
          git add suwon-trail/suwon-trail-0.13.0.apk suwon-trail/latest.json suwon-trail/SHA256SUMS
          git commit -m "Publish Suwon Trail v0.13.0 update"
          git push origin HEAD:suwon-trail-updates

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git switch master
          git pull --ff-only origin master
          git rm .github/workflows/publish-suwon-trail-v0130.yml
          git commit -m "Remove one-time v0.13.0 publisher"
          git push origin master
